<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#007AFF">
<title>Ausome Words</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  :root {
    --c-red:    #FF3B30;
    --c-orange: #FF9500;
    --c-yellow: #FFCC00;
    --c-green:  #34C759;
    --c-blue:   #007AFF;
    --c-purple: #AF52DE;
    --c-pink:   #FF2D92;
    --ink:      #1C2833;
    --ink-soft: #5A6B73;
    --bg:       #FFFFFF;
    --surface:  #F5F7FA;
  }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  button { font-family: inherit; border: none; cursor: pointer; }

.app-header {
display: flex; align-items: center; justify-content: space-between;
padding: 10px 14px; background: #FFFFFF;
border-bottom: 4px solid #F0F2F5; flex-shrink: 0; min-height: 56px;
}
.app-title { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
.app-title .t1 { color: var(--c-red); }
.app-title .t2 { color: var(--c-orange); }
.app-title .t3 { color: var(--c-yellow); }
.app-title .t4 { color: var(--c-green); }
.app-title .t5 { color: var(--c-blue); }
.app-title .t6 { color: var(--c-purple); }
.app-title .t7 { color: var(--c-pink); }
.header-actions { display: flex; align-items: center; gap: 8px; }
.level-badge {
background: var(--c-yellow); color: var(--ink);
padding: 5px 10px; border-radius: 10px;
font-size: 13px; font-weight: 800; white-space: nowrap;
}
.settings-btn, .restart-btn {
background: var(--surface); color: var(--ink);
padding: 0; border-radius: 12px; font-size: 18px;
min-height: 44px; min-width: 44px;
display: inline-flex; align-items: center; justify-content: center;
}
.settings-btn:active, .restart-btn:active { transform: scale(0.95); }

.sentence-bar {
background: #FFFFFF; border-bottom: 4px solid #F0F2F5;
padding: 12px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
}
.sentence-display {
min-height: 60px; background: var(--surface); border-radius: 16px;
padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
border: 3px dashed #D5DBE1;
}
.sentence-display.empty::before {
content: "Tap a card below to start…";
color: #95A5A6; font-size: 15px; font-style: italic;
}
.sentence-word {
background: var(--c-blue); color: #FFFFFF;
padding: 8px 14px; border-radius: 12px;
font-size: 20px; font-weight: 800;
animation: popIn 0.25s ease-out;
}
@keyframes popIn { from { transform: scale(0.5) rotate(-5deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
.sentence-controls { display: flex; gap: 8px; }
.control-btn {
flex: 1; min-height: 52px; border-radius: 14px;
font-size: 16px; font-weight: 800;
display: flex; align-items: center; justify-content: center; gap: 6px;
transition: transform 0.1s, opacity 0.2s; color: #FFFFFF;
}
.control-btn:active { transform: scale(0.95); }
.speak-btn { background: var(--c-green); flex: 2; }
.speak-btn:disabled { opacity: 0.4; }
.undo-btn { background: var(--c-orange); }
.clear-btn { background: var(--c-red); }

.content { flex: 1; overflow-y: auto; padding: 14px 12px 20px; -webkit-overflow-scrolling: touch; }
.breadcrumb {
display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
min-height: 44px; flex-wrap: wrap;
}
.back-btn {
background: #FFFFFF; border: 3px solid var(--surface); border-radius: 12px;
padding: 8px 14px; font-size: 15px; font-weight: 800; color: var(--ink);
min-height: 44px; display: flex; align-items: center; gap: 4px;
}
.back-btn:active { background: var(--surface); }
.screen-title { font-size: 17px; font-weight: 800; color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.card {
background: #FFFFFF; border: 4px solid #E8ECF1; border-radius: 20px;
padding: 16px 8px; min-height: 120px;
display: flex; flex-direction: column; align-items: center; justify-content: center;
gap: 8px; transition: transform 0.1s; color: var(--ink);
}
.card:active { transform: scale(0.96); }
.card.c-red    { border-color: var(--c-red); }
.card.c-orange { border-color: var(--c-orange); }
.card.c-yellow { border-color: var(--c-yellow); }
.card.c-green  { border-color: var(--c-green); }
.card.c-blue   { border-color: var(--c-blue); }
.card.c-purple { border-color: var(--c-purple); }
.card.c-pink   { border-color: var(--c-pink); }
.card-emoji { font-size: 48px; line-height: 1; }
.card-label { font-size: 16px; font-weight: 800; text-align: center; color: var(--ink); }
.starter-card { background: var(--c-blue); border-color: var(--c-blue); }
.starter-card .card-label { color: #FFFFFF; font-size: 22px; font-weight: 900; }

.suggestion-banner {
background: #FFFBEA; border: 2px solid var(--c-yellow);
border-radius: 14px; padding: 12px 16px; margin-bottom: 14px;
font-size: 15px; color: var(--ink); line-height: 1.5;
animation: popIn 0.3s ease-out;
}
.suggestion-label { font-weight: 800; color: var(--c-orange); margin-right: 4px; }

.settings-overlay {
position: fixed; inset: 0; background: rgba(0,0,0,0.45);
z-index: 100; display: flex; align-items: flex-end;
}
.settings-panel {
background: #FFFFFF; width: 100%; border-radius: 24px 24px 0 0;
padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
max-height: 80vh; overflow-y: auto;
}
.settings-header {
display: flex; align-items: center; justify-content: space-between;
margin-bottom: 20px;
}
.settings-title { font-size: 18px; font-weight: 900; }
.settings-close {
background: var(--surface); border-radius: 10px; padding: 0;
font-size: 18px; font-weight: 800; color: var(--ink);
min-height: 44px; min-width: 44px;
display: inline-flex; align-items: center; justify-content: center;
}
.settings-section { margin-bottom: 24px; }
.settings-section-label {
font-size: 12px; font-weight: 800; color: var(--ink-soft);
text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px;
}
.settings-levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.level-btn {
background: var(--surface); border: 3px solid transparent; border-radius: 14px;
padding: 12px 6px; color: var(--ink); min-height: 90px;
display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
transition: border-color 0.15s, background 0.15s;
}
.level-btn .level-stars { font-size: 16px; }
.level-btn .level-name  { font-size: 14px; font-weight: 800; }
.level-btn .level-desc  { font-size: 11px; font-weight: 600; color: var(--ink-soft); text-align: center; }
.level-btn.active { border-color: var(--c-blue); background: #EBF4FF; }
.level-btn.active .level-desc { color: var(--c-blue); }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.settings-row-title { font-size: 15px; font-weight: 800; }
.settings-row-hint  { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.toggle-btn {
background: #E5E5EA; color: var(--ink);
padding: 10px 16px; border-radius: 20px;
font-size: 15px; font-weight: 800; min-width: 64px; flex-shrink: 0;
transition: background 0.2s, color 0.2s;
}
.toggle-btn.on { background: var(--c-green); color: #FFFFFF; }

@media (min-width: 500px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>

<div class="app-header">
  <span class="app-title">
    <span class="t1">A</span><span class="t2">u</span><span class="t3">s</span><span class="t4">o</span><span class="t5">m</span><span class="t6">e</span>
    <span class="t4">W</span><span class="t5">o</span><span class="t6">r</span><span class="t1">d</span><span class="t2">s</span>
  </span>
  <div class="header-actions">
    <span class="level-badge" id="levelBadge">★ L1</span>
    <button class="settings-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    <button class="restart-btn" id="restartBtn" aria-label="Restart">↻</button>
  </div>
</div>

<div class="sentence-bar">
  <div id="sentenceDisplay" class="sentence-display empty"></div>
  <div class="sentence-controls">
    <button class="control-btn clear-btn" id="clearBtn">✕ Clear</button>
    <button class="control-btn undo-btn" id="undoBtn">⏪ Back</button>
    <button class="control-btn speak-btn" id="speakBtn" disabled>🔊 SPEAK</button>
  </div>
</div>

<div class="content">
  <div class="breadcrumb" id="talkBreadcrumb"></div>
  <div id="talkSuggestion"></div>
  <div class="grid" id="talkGrid"></div>
</div>

<script>
// ========= SPEECH =========
const synth = window.speechSynthesis;
let englishVoice = null;
function loadVoice() {
  const voices = synth.getVoices();
  englishVoice =
    voices.find(v => v.lang.startsWith("en") && /samantha|karen|moira|google us english|natural/i.test(v.name)) ||
    voices.find(v => v.lang.startsWith("en-US")) ||
    voices.find(v => v.lang.startsWith("en")) ||
    voices[0];
}
loadVoice();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoice;

function speak(text, opts = {}) {
  if (!text) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (englishVoice) u.voice = englishVoice;
  u.rate  = opts.rate  || 0.9;
  u.pitch = opts.pitch || 1.1;
  u.volume = 1;
  synth.speak(u);
}

// ========= AUDIO =========
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, duration = 0.4, type = "sine", volume = 0.3) {
  try {
    const ctx  = getAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}
function playHappyChime() {
  playTone(523, 0.15);
  setTimeout(() => playTone(659, 0.15), 100);
  setTimeout(() => playTone(784, 0.25), 200);
}

// ========= VOCABULARY =========
// Source of truth: data/vocabulary.json (fetched at startup).
// DEFAULT_VOCAB below is the embedded fallback used only if the fetch fails.
// Keep it in sync with the JSON file.
const DEFAULT_VOCAB = {
  starters: [
    { word: "I want", emoji: "🙋", next: "categories" },
    { word: "I need", emoji: "🆘", next: "needs"      },
    { word: "Say",    emoji: "💬", next: "social"     },
  ],
  categories: [
    { word: "Food",       emoji: "🍔", items: "food",       color: "c-red"    },
    { word: "Drinks",     emoji: "💧", items: "drinks",     color: "c-blue"   },
    { word: "Activities", emoji: "🏃", items: "activities", color: "c-green"  },
    { word: "Colors",     emoji: "🌈", items: "colors",     color: "c-yellow" },
  ],
  items: {
    food: [
      { word: "burger",           emoji: "🍔", color: "c-red",    pos: "noun-count"  },
      { word: "chicken and rice", emoji: "🍗", color: "c-orange", pos: "noun-mass"   },
      { word: "cupcakes",         emoji: "🧁", color: "c-pink",   pos: "noun-plural" },
      { word: "food",             emoji: "🍽️", color: "c-green",  pos: "noun-mass"   },
    ],
    drinks: [
      { word: "water", emoji: "💧", color: "c-blue", pos: "noun-mass"   },
      { word: "bubu",  emoji: "🍼", color: "c-blue", pos: "noun-proper" },
    ],
    activities: [
      { word: "run",           emoji: "🏃",  color: "c-orange", pos: "verb-action"     },
      { word: "jump",          emoji: "🐸",  color: "c-green",  pos: "verb-action"     },
      { word: "slides",        emoji: "🛝",  color: "c-yellow", pos: "play-equipment"  },
      { word: "tickle time",   emoji: "😄",  color: "c-pink",   pos: "noun-event"      },
      { word: "hide and seek", emoji: "🙈",  color: "c-purple", pos: "game"            },
    ],
    colors: [
      { word: "red car",       emoji: "🚗", color: "c-red",    pos: "noun-count-color" },
      { word: "blue ball",     emoji: "🔵", color: "c-blue",   pos: "noun-count-color" },
      { word: "yellow sun",    emoji: "☀️", color: "c-yellow", pos: "noun-unique"      },
      { word: "green tree",    emoji: "🌳", color: "c-green",  pos: "noun-count-color" },
      { word: "orange ball",   emoji: "🟠", color: "c-orange", pos: "noun-count-color" },
      { word: "purple flower", emoji: "💜", color: "c-purple", pos: "noun-count-color" },
    ],
    social: [
      { word: "yes",    emoji: "✅", color: "c-green",  pos: "social" },
      { word: "no",     emoji: "❌", color: "c-red",    pos: "social" },
      { word: "please", emoji: "🙏", color: "c-blue",   pos: "social" },
      { word: "borrow", emoji: "🤝", color: "c-orange", pos: "social", spoken: "Can I borrow that?" },
    ],
    needs: [
      { word: "bathroom", emoji: "🚽", color: "c-blue",  pos: "place-the"  },
      { word: "help",     emoji: "🙏", color: "c-pink",  pos: "noun-mass"  },
      { word: "more",     emoji: "➕", color: "c-green", pos: "quantifier" },
      { word: "finished", emoji: "✅", color: "c-green", pos: "state-im"   },
    ],
  },
  polite: { word: "please", emoji: "🙏" },
};

let STARTERS   = DEFAULT_VOCAB.starters;
let CATEGORIES = DEFAULT_VOCAB.categories;
let ITEMS      = DEFAULT_VOCAB.items;
let POLITE     = DEFAULT_VOCAB.polite;

let LEXICON = {};
function rebuildLexicon() {
  LEXICON = {};
  Object.values(ITEMS).forEach(arr => {
    arr.forEach(it => {
      LEXICON[it.word] = { pos: it.pos || null, spoken: it.spoken || null };
    });
  });
}
rebuildLexicon();

async function loadVocabulary() {
  try {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 3000);
    const res = await fetch("./data/vocabulary.json", { signal: controller.signal });
    clearTimeout(t);
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data.starters))   STARTERS   = data.starters;
    if (Array.isArray(data.categories)) CATEGORIES = data.categories;
    if (data.items && typeof data.items === "object") ITEMS = data.items;
    if (data.polite && typeof data.polite === "object") POLITE = data.polite;
    rebuildLexicon();
  } catch (_) { /* keep defaults */ }
}

// ========= PARENT SETTINGS =========
const SETTINGS_KEY = "ausomeWords.settings.v1";
let correctionMode = false;
let currentLevel   = 1;
try {
  const raw = localStorage.getItem(SETTINGS_KEY);
  if (raw) {
    const saved = JSON.parse(raw);
    if (typeof saved.correctionMode === "boolean") correctionMode = saved.correctionMode;
    if ([1, 2, 3].includes(saved.currentLevel)) currentLevel = saved.currentLevel;
  }
} catch (_) {}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ correctionMode, currentLevel })); }
  catch (_) {}
}

// ========= STATE =========
let sentence        = [];
let currentCategory = null;
const sentenceDisplay = document.getElementById("sentenceDisplay");
const talkGrid        = document.getElementById("talkGrid");
const talkBreadcrumb  = document.getElementById("talkBreadcrumb");
const talkSuggestion  = document.getElementById("talkSuggestion");
const speakBtn        = document.getElementById("speakBtn");

// ========= GRAMMAR =========
// Phonetic-head a/an. Covers vowel-sound words written with consonants
// ("hour", "honest") and vowel-letter starts. The current vocab triggers
// the "an orange" case via the noun-count-color branch.
function aOrAn(phrase) {
  return /^([aeiou]|hou|hon)/i.test(phrase) ? "an" : "a";
}

function renderItemPhrase(word) {
  const meta = LEXICON[word] || {};
  if (meta.spoken) return meta.spoken;
  switch (meta.pos) {
    case "noun-count":
    case "noun-count-color": return `${aOrAn(word)} ${word}`;
    case "noun-unique":
    case "place-the":        return `the ${word}`;
    case "verb-action":      return `to ${word}`;
    case "play-equipment":   return `to go on the ${word}`;
    case "game":             return `to play ${word}`;
    default:                 return word;
  }
}

function assembleSpoken(words) {
  if (!words.length) return "";
  const polite = words[words.length - 1] === POLITE.word;
  const core = polite ? words.slice(0, -1) : words.slice();
  if (!core.length) return "Please.";
  const starter = core[0];
  const item = core[1];
  // state-im swaps the starter and drops "please" — "I need finished, please" → "I'm finished."
  if (item && (LEXICON[item] || {}).pos === "state-im") return `I'm ${item}.`;
  if (!item) return `${starter}.`;
  const phrase = `${starter} ${renderItemPhrase(item)}`;
  return polite ? `${phrase}, please.` : `${phrase}.`;
}

function localSuggestion(words) {
  if (!words.length) return null;
  const suggestion = assembleSpoken(words);
  if (!suggestion) return null;
  const normalize = s => s.replace(/[.,!?]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  return normalize(suggestion) !== normalize(words.join(" ")) ? suggestion : null;
}

async function fetchSuggestion(words, level) {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);
    const res = await fetch("/.netlify/functions/suggest", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ words, level }),
      signal: controller.signal
    });
    clearTimeout(timeout);
    if (!res.ok) return localSuggestion(words);
    const { suggestion } = await res.json();
    return suggestion || localSuggestion(words);
  } catch (_) {
    return localSuggestion(words);
  }
}

// ========= SENTENCE =========
function renderSentence() {
  sentenceDisplay.innerHTML = "";
  if (sentence.length === 0) { sentenceDisplay.classList.add("empty"); speakBtn.disabled = true; return; }
  sentenceDisplay.classList.remove("empty");
  speakBtn.disabled = false;
  sentence.forEach(w => {
    const s = document.createElement("span");
    s.className = "sentence-word";
    s.textContent = w;
    sentenceDisplay.appendChild(s);
  });
}
function addWord(word)    { sentence.push(word); renderSentence(); speak(word, { rate: 0.9 }); }
function removeLastWord() { sentence.pop(); renderSentence(); }
function clearSentence()  { sentence = []; talkSuggestion.innerHTML = ""; renderSentence(); }
function speakSentence()  { if (!sentence.length) return; speak(assembleSpoken(sentence), { rate: 0.85 }); }

function createCard(label, emoji, color, isStarter) {
  const btn = document.createElement("button");
  btn.className = "card" + (isStarter ? " starter-card" : " " + (color || ""));
  btn.innerHTML = `<span class="card-emoji">${emoji}</span><span class="card-label">${label}</span>`;
  return btn;
}
function createBackButton(onClick) {
  const btn = document.createElement("button");
  btn.className = "back-btn";
  btn.textContent = "← Back";
  btn.addEventListener("click", onClick);
  return btn;
}

// ========= SCREENS =========
function renderHome() {
  talkBreadcrumb.innerHTML = `<span class="screen-title">What do you want to say?</span>`;
  talkGrid.innerHTML = "";
  talkSuggestion.innerHTML = "";
  STARTERS.forEach(s => {
    const c = createCard(s.word, s.emoji, null, true);
    c.addEventListener("click", () => {
      if (s.next === "social") {
        renderItems("social", "Social");
      } else {
        addWord(s.word);
        if (s.next === "categories") renderCategories();
        else if (s.next === "needs") renderItems("needs", "Needs");
      }
    });
    talkGrid.appendChild(c);
  });
}

function renderCategories() {
  talkBreadcrumb.innerHTML = "";
  talkBreadcrumb.appendChild(createBackButton(() => { removeLastWord(); renderHome(); }));
  const t = document.createElement("span");
  t.className = "screen-title";
  t.textContent = "Pick a category";
  talkBreadcrumb.appendChild(t);
  talkGrid.innerHTML = "";
  talkSuggestion.innerHTML = "";
  CATEGORIES.forEach(c => {
    const card = createCard(c.word, c.emoji, c.color, false);
    card.addEventListener("click", () => renderItems(c.items, c.word));
    talkGrid.appendChild(card);
  });
}

function renderItems(key, label) {
  const isSocial = key === "social";
  const isNeeds  = key === "needs";
  currentCategory = key;
  talkBreadcrumb.innerHTML = "";
  talkBreadcrumb.appendChild(createBackButton(() => {
    if (isSocial)   { renderHome(); }
    else if (isNeeds) { removeLastWord(); renderHome(); }
    else              { renderCategories(); }
  }));
  const t = document.createElement("span");
  t.className = "screen-title";
  t.textContent = label;
  talkBreadcrumb.appendChild(t);
  talkGrid.innerHTML = "";
  talkSuggestion.innerHTML = "";

  (ITEMS[key] || []).forEach(it => {
    const card = createCard(it.word, it.emoji, it.color, false);
    card.addEventListener("click", () => {
      if (isSocial) {
        speak(it.spoken || it.word, { rate: 0.9 });
        playHappyChime();
        setTimeout(() => renderHome(), 1500);
      } else {
        addWord(it.word);
        renderFinish();
      }
    });
    talkGrid.appendChild(card);
  });
}

function renderFinish() {
  talkBreadcrumb.innerHTML = "";
  talkBreadcrumb.appendChild(createBackButton(() => {
    removeLastWord();
    if (currentCategory) {
      const cat = CATEGORIES.find(c => c.items === currentCategory);
      renderItems(currentCategory, cat ? cat.word : currentCategory);
    } else {
      renderHome();
    }
  }));
  const t = document.createElement("span");
  t.className = "screen-title";
  t.textContent = "Add 'please' or speak now!";
  talkBreadcrumb.appendChild(t);
  talkGrid.innerHTML = "";

  talkSuggestion.innerHTML = "";
  if (correctionMode && currentLevel >= 2) {
    fetchSuggestion(sentence, currentLevel).then(suggestion => {
      if (suggestion) {
        talkSuggestion.innerHTML = `<div class="suggestion-banner"><span class="suggestion-label">Try saying:</span> <em>${suggestion}</em></div>`;
      }
    });
  }

  const pleaseCard = createCard(POLITE.word, POLITE.emoji, null, true);
  pleaseCard.addEventListener("click", () => {
    addWord(POLITE.word);
    setTimeout(() => speakSentence(), 400);
    setTimeout(() => { clearSentence(); renderHome(); playHappyChime(); }, 2500);
  });
  talkGrid.appendChild(pleaseCard);

  const speakCard = createCard("Speak now", "🔊", null, true);
  speakCard.addEventListener("click", () => {
    speakSentence();
    setTimeout(() => { clearSentence(); renderHome(); playHappyChime(); }, 2000);
  });
  talkGrid.appendChild(speakCard);

  const restartCard = createCard("Start over", "🔄", "c-red", false);
  restartCard.addEventListener("click", () => { clearSentence(); renderHome(); });
  talkGrid.appendChild(restartCard);
}

// ========= SETTINGS =========
function updateLevelBadge() {
  const badge = document.getElementById("levelBadge");
  if (badge) badge.textContent = "★".repeat(currentLevel) + " L" + currentLevel;
}

function renderSettings() {
  if (document.querySelector(".settings-overlay")) return;
  const overlay = document.createElement("div");
  overlay.className = "settings-overlay";
  overlay.innerHTML = `
    <div class="settings-panel">
      <div class="settings-header">
        <span class="settings-title">⚙ Settings</span>
        <button class="settings-close" id="settingsClose">✕</button>
      </div>
      <div class="settings-section">
        <div class="settings-section-label">Level</div>
        <div class="settings-levels">
          <button class="level-btn ${currentLevel === 1 ? "active" : ""}" data-level="1">
            <span class="level-stars">⭐</span>
            <span class="level-name">Level 1</span>
            <span class="level-desc">Match what he says</span>
          </button>
          <button class="level-btn ${currentLevel === 2 ? "active" : ""}" data-level="2">
            <span class="level-stars">⭐⭐</span>
            <span class="level-name">Level 2</span>
            <span class="level-desc">Add missing words</span>
          </button>
          <button class="level-btn ${currentLevel === 3 ? "active" : ""}" data-level="3">
            <span class="level-stars">⭐⭐⭐</span>
            <span class="level-name">Level 3</span>
            <span class="level-desc">Color phrases</span>
          </button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-label">Gentle Correction</div>
        <div class="settings-row">
          <div>
            <div class="settings-row-title">Show "Try saying:" suggestion</div>
            <div class="settings-row-hint">Appears after each sentence is built. Off by default.</div>
          </div>
          <button class="toggle-btn ${correctionMode ? "on" : ""}" id="correctionToggle">
            ${correctionMode ? "ON" : "OFF"}
          </button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector("#settingsClose").addEventListener("click", () => document.body.removeChild(overlay));

  overlay.querySelectorAll(".level-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentLevel = parseInt(btn.dataset.level, 10);
      overlay.querySelectorAll(".level-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      updateLevelBadge();
      saveSettings();
    });
  });

  overlay.querySelector("#correctionToggle").addEventListener("click", function () {
    correctionMode = !correctionMode;
    this.textContent = correctionMode ? "ON" : "OFF";
    this.classList.toggle("on", correctionMode);
    saveSettings();
  });

  overlay.addEventListener("click", e => { if (e.target === overlay) document.body.removeChild(overlay); });
}

// ========= CONTROLS =========
document.getElementById("speakBtn").addEventListener("click", speakSentence);
document.getElementById("undoBtn").addEventListener("click", removeLastWord);
document.getElementById("clearBtn").addEventListener("click", () => { clearSentence(); renderHome(); });
document.getElementById("restartBtn").addEventListener("click", () => { clearSentence(); renderHome(); });
document.getElementById("settingsBtn").addEventListener("click", renderSettings);

// Prime audio + speech on first touch (iOS requirement)
document.addEventListener("touchstart", function prime() {
  try { getAudioCtx().resume(); } catch (e) {}
  const u = new SpeechSynthesisUtterance("");
  synth.speak(u);
  document.removeEventListener("touchstart", prime);
}, { once: true });

// Initial render — wait for vocabulary fetch (with 3 s timeout fallback to DEFAULT_VOCAB)
loadVocabulary().then(() => {
  updateLevelBadge();
  renderHome();
  renderSentence();
});
</script>

</body>
</html>
